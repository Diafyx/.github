name: Bug report
description: Something isn't working as expected.
type: Bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug. Please search existing issues first.
        **Security vulnerabilities must not be reported here.** See the [security policy](https://github.com/Diafyx/.github/blob/main/SECURITY.md).

  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: A clear description of the bug.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: The exact steps that trigger the bug.
      placeholder: |
        1. Open ...
        2. Click ...
        3. See ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What you expected to happen instead.
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Version or commit
      description: Release version, commit SHA, or the URL you were using.
      placeholder: "v0.1.0 / 1a2b3c4 / https://..."

  - type: input
    id: environment
    attributes:
      label: Environment
      description: Browser and OS, or Node.js version and OS.
      placeholder: "Chrome on macOS / Firefox on Windows"

  - type: textarea
    id: extra
    attributes:
      label: Screenshots, logs or other context
      description: Anything else that helps. You can paste images directly; wrap logs in triple backticks.
